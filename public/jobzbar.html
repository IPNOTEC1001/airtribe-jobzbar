<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOBZ.BAR — The Professional Network for Bar & F&B</title>
<meta name="description" content="JOBZ.BAR is the professional network for the bar, beverage and F&B industry. Gig shifts, long-term jobs, and real industry talk.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:oklch(.975 .004 160); --bg2:oklch(.95 .006 160); --card:oklch(1 0 0); --card2:oklch(.94 .014 160); --line:oklch(.87 .012 160);
  --text:oklch(.24 .022 160); --muted:oklch(.49 .019 160); --amber:oklch(.39 .08 163); --pink:oklch(.52 .17 26); --lime:oklch(.43 .1 152); --sky:oklch(.44 .08 237);
  --primary-ink:oklch(.99 0 0); --hero-ink:oklch(.99 0 0); --hero-muted:oklch(.92 .012 160); --hero-scrim:oklch(.18 .026 160 / .84); --overlay:oklch(.2 .02 160 / .5); --danger:oklch(.5 .17 26); --shadow:0 12px 36px oklch(.2 .02 160 / .12);
  --grad:var(--amber); --r:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;line-height:1.5;
  min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.display{font-family:'Bebas Neue',sans-serif;letter-spacing:0;line-height:1}

/* NAV */
.nav{position:sticky;top:0;z-index:50;background:rgba(11,10,16,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1200px;margin:auto;display:flex;align-items:center;gap:20px;padding:12px 20px}
.logo{font-family:'Bebas Neue';font-size:30px;letter-spacing:2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.search{flex:1;max-width:340px;position:relative}
.search input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 16px 9px 38px;outline:none}
.search input:focus{border-color:var(--amber)}
.search span{position:absolute;left:14px;top:8px;opacity:.6}
.tabs{display:flex;gap:4px;margin-left:auto}
.tab{padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px;transition:.2s;display:flex;gap:6px;align-items:center}
.tab:hover{color:var(--text);background:var(--card)}
.tab.on{color:#16121c;background:var(--amber)}
.badge-dot{background:var(--pink);color:#fff;font-size:10px;border-radius:999px;padding:1px 6px}

/* LAYOUT */
.wrap{max-width:1200px;margin:auto;padding:24px 20px 100px;display:grid;grid-template-columns:260px 1fr 300px;gap:24px}
.wrap.wide{grid-template-columns:260px 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack>*+*{margin-top:16px}
.side{position:sticky;top:84px;align-self:start}
h3.sec{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}

/* PROFILE MINI */
.pcover{height:70px;border-radius:12px;background:var(--grad);margin:-6px -6px 0}
.avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#16121c;flex:none;font-size:16px}
.avatar.lg{width:76px;height:76px;font-size:26px;border:4px solid var(--card);margin-top:-38px}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
.chip.amber{color:var(--amber);border-color:rgba(255,181,71,.35);background:rgba(255,181,71,.08)}
.chip.pink{color:var(--pink);border-color:rgba(255,61,127,.35);background:rgba(255,61,127,.08)}
.chip.lime{color:var(--lime);border-color:rgba(182,255,59,.35);background:rgba(182,255,59,.08)}
.chip.sky{color:var(--sky);border-color:rgba(90,209,255,.35);background:rgba(90,209,255,.08)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.stat{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.stat b{color:var(--amber)}

/* BUTTONS */
.btn{padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:.2s;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.pri{background:var(--grad);color:#16121c}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 24px -8px rgba(255,61,127,.6)}
.btn.ghost{border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.done{background:var(--card2);color:var(--lime);border:1px solid rgba(182,255,59,.3)}

/* HERO */
.hero{grid-column:1/-1;border-radius:24px;padding:36px;background:linear-gradient(120deg,#1d1426,#14101b);border:1px solid var(--line);display:grid;grid-template-columns:1.4fr 1fr;gap:24px;position:relative;overflow:hidden}
.hero::after{content:"🍸";position:absolute;right:-20px;bottom:-60px;font-size:240px;opacity:.07;transform:rotate(-15deg)}
.hero h1{font-family:'Bebas Neue';font-size:clamp(44px,6vw,76px);line-height:.92;letter-spacing:1px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);margin:14px 0 22px;max-width:480px;font-size:16px}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:center}
.hstat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:16px}
.hstat .display{font-size:40px;color:var(--amber)}
.hstat:nth-child(2) .display{color:var(--pink)}
.hstat:nth-child(3) .display{color:var(--lime)}
.hstat:nth-child(4) .display{color:var(--sky)}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--lime);font-weight:700;margin-bottom:12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 0 12px var(--lime);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}

/* COMPOSER + POSTS */
.composer textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;resize:none;min-height:70px;outline:none}
.composer textarea:focus{border-color:var(--amber)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.tagpick{display:flex;gap:6px;flex-wrap:wrap}
.tagpick button{padding:5px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted)}
.tagpick button.on{border-color:var(--amber);color:var(--amber);background:rgba(255,181,71,.08)}
.post{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.post .body{margin:12px 0;white-space:pre-wrap}
.actions{display:flex;gap:4px;border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.act{flex:1;padding:8px;border-radius:10px;color:var(--muted);font-weight:600;font-size:13px}
.act:hover{background:var(--card2);color:var(--text)}
.act.on{color:var(--pink)}
.comments{margin-top:10px}
.cmt{background:var(--bg2);border-radius:12px;padding:8px 12px;margin-top:8px;font-size:14px}
.cmt b{font-size:13px}
.cin{display:flex;gap:8px;margin-top:10px}
.cin input,.field input,.field select,.field textarea{flex:1;width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
.cin input:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--amber)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.filter button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.filter button.on{background:var(--text);color:var(--bg);border-color:var(--text)}

/* JOBS */
.job{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:start;transition:.2s}
.job:hover{border-color:rgba(255,181,71,.4);transform:translateY(-2px)}
.logo-sq{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;font-size:26px;background:var(--card2);border:1px solid var(--line)}
.job h4{font-size:17px}
.pay{font-family:'Bebas Neue';font-size:26px;color:var(--amber);text-align:right;line-height:1}
.gig .pay{color:var(--lime)}
.jobs-grid{display:grid;gap:12px}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{padding:8px 18px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--grad);color:#16121c}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select,.toolbar input{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:9px 14px;outline:none}

/* LOUNGES */
.lounges{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.lounge{cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.lounge:hover{transform:translateY(-3px);border-color:var(--amber)}
.lounge .emo{font-size:36px}
.lounge h4{font-family:'Bebas Neue';font-size:30px;letter-spacing:1px;margin-top:6px}
.thread{cursor:pointer}
.thread:hover{border-color:rgba(255,181,71,.4)}

/* PEOPLE */
.person{display:flex;align-items:center;gap:10px;padding:8px 0}
.person .info{flex:1;min-width:0}
.person .info div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend{padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.trend:last-child{border:0}
.trend:hover b{color:var(--amber)}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(5,4,8,.75);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.open{display:flex}
.modal .card{width:100%;max-width:480px;max-height:90vh;overflow:auto;animation:in .25s ease}
.field{margin-top:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:200;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;padding:40px;color:var(--muted)}
.mob-nav{display:none}
footer{text-align:center;color:var(--muted);font-size:13px;padding:30px}

@media(max-width:1050px){.wrap{grid-template-columns:240px 1fr}.right{display:none}}
@media(max-width:760px){
  .wrap,.wrap.wide{grid-template-columns:1fr;padding:16px 12px 100px}
  .left{display:none}.tabs{display:none}.hero{grid-template-columns:1fr;padding:24px}
  .lounges{grid-template-columns:1fr}.job{grid-template-columns:44px 1fr}.job .side-pay{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}.logo-sq{width:44px;height:44px;font-size:20px}
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:rgba(11,10,16,.95);border-top:1px solid var(--line);z-index:60;backdrop-filter:blur(12px)}
  .mob-nav button{flex:1;padding:10px 0 12px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
  .mob-nav button span{font-size:20px}.mob-nav button.on{color:var(--amber)}
}

/* JOBZ.BAR — editorial clubhouse theme */
.display,.logo{letter-spacing:0}.logo{color:var(--amber);background:none;font-size:34px}.nav{background:var(--card)}
.nav-in{gap:14px}.search{max-width:260px}.search input{border-radius:6px;background:var(--bg)}
.tab{border-radius:6px;padding:9px 11px;white-space:nowrap}.tab.on,.seg button.on{color:var(--primary-ink);background:var(--amber)}
.badge-dot{color:var(--primary-ink)}.wrap{gap:20px}.btn{border-radius:6px}.btn.pri{background:var(--amber);color:var(--primary-ink)}
.btn.pri:hover{box-shadow:var(--shadow)}.btn:disabled{opacity:.45;cursor:not-allowed}.avatar{color:var(--text)}
.chip.amber,.chip.pink,.chip.lime,.chip.sky{background:var(--bg);border-color:var(--line)}
.pcover{background:var(--amber);border-radius:5px;position:relative}.pcover:after{content:'THE INDUSTRY IS YOUR CIRCLE.';position:absolute;right:10px;top:12px;color:var(--primary-ink);font-size:9px;max-width:90px;line-height:1.4}

.hero:after{display:none}.hero h1{font-size:76px;letter-spacing:0;line-height:1}.hero h2{font-size:23px;font-weight:500;margin-top:8px}.hero p{color:var(--hero-muted);font-size:15px;margin:12px 0 22px}.hero .live{color:var(--hero-muted);font-size:10px;letter-spacing:0;margin-bottom:12px}
.hero .btn.pri{background:var(--card);color:var(--text)}.hero .btn.ghost{color:var(--hero-ink);border-color:var(--hero-muted)}.hero-copy{position:relative;z-index:1}.hero-caption{position:absolute;right:22px;bottom:20px;display:flex;flex-direction:column;align-items:flex-end;font-size:9px;color:var(--hero-muted)}
.product-strip{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:0 0 17px;font-size:12px;font-weight:600}
.seg,.seg button,.toolbar select,.toolbar input{border-radius:6px}.tagpick button.on{background:var(--card2);border-color:var(--amber)}
.modal{background:var(--overlay)}.mob-nav{background:var(--card)}.toast{background:var(--text);color:var(--card)}
.venue-teaser{padding:18px 6px;border-bottom:1px solid var(--line)}.venue-teaser h3{font-size:25px;line-height:1.15;margin:10px 0}.venue-teaser .btn{margin-top:12px}
.eyebrow{font-size:10px;font-weight:700;color:var(--amber)}.venue-intro{padding:4px 0 22px;border-bottom:1px solid var(--line)}.venue-intro h1{font-size:46px;margin:8px 0;font-family:'Bebas Neue';line-height:1;letter-spacing:0}.venue-intro p{max-width:520px}.venue-title{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.venue-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.venue-card{padding:0;overflow:hidden}.venue-card-cover{height:118px;background:var(--amber);color:var(--primary-ink);padding:16px;display:flex;justify-content:space-between;align-items:flex-end}.venue-card:nth-child(2) .venue-card-cover{background:var(--sky)}.venue-card:nth-child(3) .venue-card-cover{background:var(--text)}.venue-card:nth-child(4) .venue-card-cover{background:var(--pink)}.venue-card-cover .display{font-size:27px;max-width:75%;line-height:1.05}.venue-card-body{padding:16px}.venue-card .btn{margin-top:16px;width:100%}
.demo-note{font-size:12px;padding:10px 12px;background:var(--card2);color:var(--muted);border-left:3px solid var(--amber)}
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:var(--card2);font-size:12px;white-space:nowrap}.ticker-in{display:inline-flex;gap:22px;padding:8px 0;animation:tick 40s linear infinite}@keyframes tick{to{transform:translateX(-50%)}}.net-stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}.net-stats div{padding:14px;text-align:center;border-right:1px solid var(--line)}.net-stats b{display:block;font-size:24px}.net-stats span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px}.persona-tags{display:flex;flex-wrap:wrap;gap:6px}.tagpick{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}.recap-card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px}
.room-band{background:var(--card2);border-bottom:1px solid var(--line);padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.room-members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.member-card h3{font-size:16px}.member-card .row{align-items:flex-start}.member-card .btn{margin-top:14px}.presence{width:7px;height:7px;display:inline-block;background:var(--lime);border-radius:50%;margin-right:5px}
.chat-launcher{position:fixed;right:24px;bottom:24px;z-index:80;display:flex;gap:10px;align-items:center;padding:12px 18px;background:var(--amber);color:var(--primary-ink);border-radius:6px;box-shadow:var(--shadow);font-weight:600;font-size:14px}.chat-launcher #chatStatus{font-size:10px;border-left:1px solid currentColor;padding-left:10px;opacity:.85}
.chat-panel{position:fixed;right:24px;bottom:82px;width:390px;height:550px;max-height:calc(100dvh - 110px);background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:85;display:flex;flex-direction:column;overflow:hidden}.chat-panel[hidden]{display:none}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:15px;border-bottom:1px solid var(--line)}.icon-btn{width:32px;height:32px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}.icon-btn:hover{background:var(--card2)}
.chat-lock{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px;gap:15px}.lock-symbol{font-size:44px;color:var(--amber)}.chat-lock h2{font-size:22px}.chat-lock p{font-size:13px;color:var(--muted)}
.chat-channel{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line);align-items:center}.chat-channel select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px}.chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}.message{max-width:92%;align-self:flex-start}.message.own{align-self:flex-end}.message small{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.message p{padding:10px 12px;background:var(--bg2);border-radius:6px;font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}.message.own p{background:var(--card2)}.chat-compose{display:flex;gap:6px;border-top:1px solid var(--line);padding:10px}.chat-compose input{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:10px;font-size:13px}.chat-compose .btn{padding:8px 12px}.chat-foot{font-size:10px;color:var(--muted);padding:7px 12px;border-top:1px solid var(--line)}
.consent{display:flex;align-items:flex-start;gap:10px;font-size:13px;margin:16px 0}.consent input{margin-top:4px;accent-color:var(--amber)}.session-summary{display:flex;gap:28px;border-block:1px solid var(--line);padding:16px 0;margin:15px 0}.session-summary b{font-size:26px;display:block;color:var(--amber)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.stat-box{border:1px solid var(--line);border-radius:8px;padding:14px}.stat-box b{display:block;font-size:26px}.stat-box span{font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px}.bar-row{display:grid;grid-template-columns:150px 1fr 36px;gap:10px;align-items:center;font-size:12px;margin-top:8px}.bar-row b{text-align:right}.bar-track{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}.bar-fill{height:100%;border-radius:99px}.filter-opt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:10px;cursor:pointer;text-align:left;width:100%;background:none;color:inherit;font:inherit}.filter-opt.on{border-color:var(--amber);background:rgba(255,181,71,.06)}.filter-opt small{display:block;opacity:.65;margin-top:2px}.filter-opt b{font-size:18px}.live-log div{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.live-log div:last-child{border-bottom:0}
@media(max-width:1100px){.nav-in{gap:8px}.search{max-width:190px}.tab{padding:9px 8px;font-size:12px}.wrap{grid-template-columns:220px minmax(0,1fr)}.wrap.wide{grid-template-columns:220px minmax(0,1fr)}}
@media(max-width:760px){.wrap,.wrap.wide{grid-template-columns:minmax(0,1fr)}.hero{min-height:350px;padding:24px;background-position:58% center}.hero h1{font-size:64px}.hero h2{font-size:20px}.hero-caption{display:none}.product-strip{flex-wrap:wrap;font-size:10px}.search{max-width:none}.nav-in{padding:10px 14px;gap:14px}.logo{font-size:30px}.search input{font-size:12px;padding-right:8px}.venue-grid,.room-members{grid-template-columns:minmax(0,1fr)}.chat-launcher{bottom:78px;right:12px;padding:10px 14px}.chat-panel{right:12px;bottom:130px;width:calc(100% - 24px);height:510px;max-height:calc(100dvh - 150px)}.mob-nav button{font-size:9px;min-width:0}.mob-nav button span{font-size:18px}.venue-intro h1{font-size:38px}.hero .btn{font-size:12px;padding:10px 12px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


/* ============ BAR MODE (premium learning) ============ */
:root{--bm-bg:oklch(.17 .018 160);--bm-card:oklch(.22 .02 160);--bm-line:oklch(.34 .03 150);--bm-ink:oklch(.96 .01 90);--bm-muted:oklch(.74 .03 90);--bm-gold:oklch(.8 .12 82);--bm-gold-deep:oklch(.66 .12 70);--bm-ok:oklch(.74 .14 152);--bm-bad:oklch(.68 .17 26)}
.bm{grid-column:1/-1;background:radial-gradient(120% 80% at 100% 0%,oklch(.3 .05 80 / .45),transparent 60%),var(--bm-bg);color:var(--bm-ink);border-radius:14px;padding:28px;border:1px solid var(--bm-line);animation:bmIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes bmIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.bm .muted,.bm .small.muted{color:var(--bm-muted)}
.bm-eyebrow{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--bm-gold)}
.bm-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,6vw,68px);line-height:.95;margin:8px 0 10px}
.bm-title em{font-style:normal;color:var(--bm-gold)}
.bm-switch{display:inline-flex;border:1px solid var(--bm-line);border-radius:999px;padding:3px;margin-bottom:18px}
.bm-switch button{padding:6px 16px;border-radius:999px;font-weight:700;font-size:12px;letter-spacing:2px;color:var(--bm-muted)}
.bm-switch button.on{background:var(--bm-gold);color:var(--bm-bg)}
.bm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.bm-card{background:var(--bm-card);border:1px solid var(--bm-line);border-radius:12px;padding:18px;transition:.25s}
.bm-card:hover{border-color:var(--bm-gold-deep);transform:translateY(-2px)}
.bm-card h3{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:.5px}
.bm-price{font-family:'Bebas Neue',sans-serif;font-size:84px;line-height:1;color:var(--bm-gold)}
.bm-btn{background:linear-gradient(135deg,var(--bm-gold),var(--bm-gold-deep));color:var(--bm-bg);font-weight:800;letter-spacing:1px;padding:13px 22px;border-radius:8px;transition:.2s}
.bm-btn:hover{transform:translateY(-1px);box-shadow:0 12px 28px -10px var(--bm-gold)}
.bm-btn:disabled{opacity:.5;transform:none;box-shadow:none}
.bm-ghost{border:1px solid var(--bm-line);color:var(--bm-ink);padding:10px 16px;border-radius:8px;font-weight:700;font-size:13px}
.bm-ghost:hover{border-color:var(--bm-gold);color:var(--bm-gold)}
.bm-list{list-style:none;display:grid;gap:8px;margin:14px 0}
.bm-list li::before{content:'✦ ';color:var(--bm-gold)}
.bm-bar{height:6px;border-radius:9px;background:var(--bm-line);overflow:hidden}
.bm-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--bm-gold-deep),var(--bm-gold));transition:width .5s}
.bm-q{font-size:clamp(19px,2.4vw,24px);font-weight:700;margin:16px 0}
.bm-opt{display:block;width:100%;text-align:left;padding:13px 16px;border:1px solid var(--bm-line);border-radius:10px;margin-bottom:9px;background:var(--bm-card);transition:.2s}
.bm-opt:hover:not(:disabled){border-color:var(--bm-gold)}
.bm-opt.ok{border-color:var(--bm-ok);background:oklch(.74 .14 152 / .14)}
.bm-opt.bad{border-color:var(--bm-bad);background:oklch(.68 .17 26 / .14)}
.bm-exp{border-left:3px solid var(--bm-gold);padding:12px 14px;background:oklch(.8 .12 82 / .07);border-radius:0 8px 8px 0;margin-top:10px;animation:bmIn .35s}
.bm-ai{margin-top:10px;padding:14px;border:1px dashed var(--bm-gold-deep);border-radius:10px;font-size:14px;line-height:1.6}
.bm-ai ul{padding-left:18px;margin:6px 0}
.bm-ai b{color:var(--bm-gold)}
.bm-stat{font-family:'Bebas Neue',sans-serif;font-size:44px;color:var(--bm-gold);line-height:1}
.bm-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bm-demo{font-size:11px;letter-spacing:2px;color:var(--bm-muted);border:1px solid var(--bm-line);padding:4px 10px;border-radius:999px;display:inline-block}
.bm-days{display:flex;gap:6px;margin-top:10px}.bm-days span{flex:1;height:28px;border-radius:6px;background:var(--bm-line);display:grid;place-items:center;font-size:11px;color:var(--bm-muted)}
.bm-days span.on{background:var(--bm-gold);color:var(--bm-bg);font-weight:800}
.tab.tab-bm{color:var(--amber);font-weight:800}.tab.tab-bm.on{color:var(--primary-ink)}
</style>
</head>
<body>

  <a href="#" class="logo" onclick="go('feed');return false">JOBZ.BAR</a>

<main id="app"></main>

<script>
/* ============ DATA ============ */
const COLORS=['var(--card2)','color-mix(in oklch,var(--pink) 15%,var(--card))','color-mix(in oklch,var(--sky) 16%,var(--card))'];
const col=s=>COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const ini=s=>s.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TAGS=['Cocktails','Spirits','Wine','Beer','Kitchen','Ops & Mgmt','Careers','News'];
const CITIES=['All cities','Mumbai','Delhi NCR','Bangalore','Goa','Pune','Dubai','London'];
const ROLES=['All roles','Bartender','Mixologist','Bar Manager','Sommelier','Server','Chef','Barback','Brand Ambassador','Event Staff'];

const SEED={
 me:{name:'You',role:'Bartender · Mumbai',bio:'Shaking things up behind the bar.',skills:['Classic cocktails','Speed service','POS'],exp:'2 yrs'},
 posts:[
  {id:1,name:'Ananya Rao',role:'Head Mixologist · Soho House Mumbai',tag:'Cocktails',time:'2h',likes:84,liked:false,body:'Hot take: clarified milk punch is the most underrated technique for Indian monsoon menus. Shelf stable, crystal clear, and it takes spice beautifully. Who else is batching it?',comments:[{name:'Kabir Mehta',text:'We run a masala chai milk punch. Sells out every Friday.'}]},
  {id:2,name:'The Bombay Canteen',role:'Restaurant · Hiring',tag:'Careers',time:'4h',likes:142,liked:false,body:'We are opening our 3rd outlet in Bandra 🎉 Hiring 6 bartenders, 2 bar managers and a beverage lead. Check the Jobs tab, or DM us your Bar Card.',comments:[]},
  {id:3,name:'Rohan D\'Souza',role:'Sommelier · WSET L3',tag:'Wine',time:'6h',likes:57,liked:false,body:'Indian wine pairing cheat-sheet for butter chicken:\n• Off-dry Riesling\n• Grenache rosé\n• Light Pinot Noir\nSkip the big oaky reds, they fight the spice.',comments:[{name:'Meera Iyer',text:'Saving this for my next staff training!'}]},
  {id:4,name:'Priya Nair',role:'Bar Manager · Goa',tag:'Ops & Mgmt',time:'1d',likes:203,liked:false,body:'We cut our liquor cost from 24% to 19% in 3 months. What worked: weekly par audits, jiggers on every station, and training staff on WHY pour cost matters. Happy to share our template.',comments:[]},
  {id:5,name:'Kabir Mehta',role:'Brand Ambassador · Craft Gin',tag:'News',time:'1d',likes:66,liked:false,body:'Indian craft gin exports grew again this year. Brands are hiring ambassadors in Tier-2 cities. Big opportunity for bartenders who can tell a story.',comments:[]}
 ],
 jobs:[
  {id:1,type:'gig',title:'Wedding Bartender (2 nights)',co:'Sangeet Events Co.',city:'Goa',role:'Bartender',pay:'₹4,500',per:'/night',when:'Sat–Sun',emoji:'💍',tags:['Urgent','Flair a plus'],posted:'1h'},
  {id:2,type:'gig',title:'Rooftop Pop-up Mixologist',co:'Skyline Social',city:'Mumbai',role:'Mixologist',pay:'₹3,000',per:'/shift',when:'This Friday',emoji:'🌇',tags:['Tips shared'],posted:'3h'},
  {id:3,type:'gig',title:'Festival Bar Crew (x10)',co:'Sunburn Fest',city:'Goa',role:'Event Staff',pay:'₹2,500',per:'/day',when:'Dec 28–30',emoji:'🎪',tags:['Meals','Stay provided'],posted:'5h'},
  {id:4,type:'gig',title:'Corporate Wine Tasting Host',co:'Vinoteca Events',city:'Bangalore',role:'Sommelier',pay:'₹6,000',per:'/event',when:'Next Wed',emoji:'🍷',tags:['WSET preferred'],posted:'8h'},
  {id:5,type:'gig',title:'Weekend Barback',co:'Toit Brewpub',city:'Bangalore',role:'Barback',pay:'₹1,800',per:'/shift',when:'Weekends',emoji:'🍺',tags:['Beginner friendly'],posted:'1d'},
  {id:6,type:'gig',title:'Brunch Server (Sundays)',co:'Olive Bar & Kitchen',city:'Delhi NCR',role:'Server',pay:'₹2,000',per:'/shift',when:'Every Sun',emoji:'🥂',tags:['Recurring'],posted:'1d'},
  {id:7,type:'full',title:'Bar Manager',co:'The Bombay Canteen',city:'Mumbai',role:'Bar Manager',pay:'₹9–12L',per:'/yr',when:'Full-time',emoji:'🍸',tags:['Leadership','Inventory'],posted:'4h'},
  {id:8,type:'full',title:'Head Bartender',co:'Taj Hotels',city:'Delhi NCR',role:'Bartender',pay:'₹6–8L',per:'/yr',when:'Full-time',emoji:'🏨',tags:['5-star','Benefits'],posted:'1d'},
  {id:9,type:'full',title:'Brand Ambassador — Single Malt',co:'Premium Spirits Co.',city:'Bangalore',role:'Brand Ambassador',pay:'₹14–18L',per:'/yr',when:'Full-time',emoji:'🥃',tags:['Travel','Car allowance'],posted:'2d'},
  {id:10,type:'full',title:'Sommelier',co:'Atmosphere 6',city:'Dubai',role:'Sommelier',pay:'AED 12K',per:'/mo',when:'Full-time',emoji:'🌍',tags:['Visa sponsored','Tax-free'],posted:'2d'},
  {id:11,type:'full',title:'Sous Chef — Bar Bites',co:'PCO Speakeasy',city:'Delhi NCR',role:'Chef',pay:'₹7–9L',per:'/yr',when:'Full-time',emoji:'🔪',tags:['Small plates'],posted:'3d'},
  {id:12,type:'full',title:'Cocktail Bartender',co:'Swift & Sons',city:'London',role:'Mixologist',pay:'£32K',per:'/yr',when:'Full-time',emoji:'🇬🇧',tags:['Visa support'],posted:'4d'}
 ],
 lounges:[
  {id:'counter',emoji:'🍺',name:'The Counter',desc:'Quick questions, quick answers from people who work the floor.',members:412,color:'amber'},
  {id:'booth',emoji:'🛋️',name:'The Booth',desc:'Career stories, mock interviews and honest salary talk.',members:287,color:'pink'},
  {id:'cellar',emoji:'🍷',name:'The Cellar',desc:'Spirits, wine and technique deep dives for the curious.',members:334,color:'lime'},
  {id:'terrace',emoji:'🌃',name:'The Terrace',desc:'Industry news, openings, launches and who\'s hiring.',members:521,color:'sky'}
 ],
 threads:[
  {id:1,lounge:'counter',title:'Fastest way to become a bar manager without hotel experience?',by:'Arjun S',replies:[{name:'Priya Nair',text:'Run inventory at a standalone for a year. Owners notice numbers.'}]},
  {id:2,lounge:'counter',title:'Best jigger brand for high-volume bars?',by:'Neha K',replies:[]},
  {id:3,lounge:'booth',title:'How I went from beach shack bartender to brand ambassador',by:'Kabir Mehta',replies:[{name:'Ananya Rao',text:'Legend. Storytelling is everything in this job.'}]},
  {id:4,lounge:'booth',title:'Negotiating salary when moving from a hotel to a standalone bar',by:'Vikram P',replies:[]},
  {id:5,lounge:'cellar',title:'WSET vs CMS: which certification pays off in India?',by:'Rohan D\'Souza',replies:[]},
  {id:6,lounge:'cellar',title:'Best Indian craft gins for a G&T program',by:'Meera Iyer',replies:[]},
  {id:7,lounge:'terrace',title:'Big hospitality group entering Bangalore, hiring 200+',by:'Insider',replies:[]},
  {id:8,lounge:'terrace',title:'Tier-2 cities going premium: Pune, Kochi, Indore',by:'Sana M',replies:[]}
 ],
 people:[
  {name:'Meera Iyer',role:'Bar Trainer · Pune'},{name:'Vikram Patel',role:'GM · Hard Rock Cafe'},
  {name:'Sana Malik',role:'F&B Recruiter · Dubai'},{name:'Arjun Shetty',role:'Flair Bartender · Goa'}
 ],
 connected:[],saved:[],applied:[]
};

let S=JSON.parse(localStorage.getItem('jobzbar_v1')||'null')||structuredClone(SEED);
const save=()=>localStorage.setItem('jobzbar_v1',JSON.stringify(S));
let view='feed',jobType='gig',city='All cities',role='All roles',postTag='Cocktails',feedTag='All',query='',openLounge=null,openComments={};

/* ============ NAV ============ */
const TABS=[['feed','🏠','Feed'],['gigs','⚡','Gigs'],['jobs','💼','Jobs'],['lounges','🥃','Lounges'],['venue','◉','At the bar'],['learn','✦','Bar Mode'],['me','👤','My Card']];
function renderNav(){
  const html=TABS.map(([k,e,l])=>`<button class="tab ${view===k?'on':''} ${k==='learn'?'tab-bm':''}" onclick="go('${k}')">${e} ${l}${k==='gigs'?`<span class="badge-dot">${S.jobs.filter(j=>j.type==='gig').length}</span>`:''}</button>`).join('');
  document.getElementById('tabs').innerHTML=html;
  renderAuthChip();
  document.getElementById('mobnav').innerHTML=TABS.map(([k,e,l])=>`<button class="${view===k?'on':''}" onclick="go('${k}')"><span>${e}</span>${l}</button>`).join('');
}
function go(v){view=v;openLounge=null;if(v==='gigs')jobType='gig';if(v==='jobs')jobType='full';render();window.scrollTo({top:0,behavior:'smooth'})}
function onSearch(v){query=v.toLowerCase();if(!['feed','gigs','jobs'].includes(view))view='jobs';render(true)}

/* ============ PIECES ============ */
const av=(n,cls='')=>`<div class="avatar ${cls}" style="background:${col(n)}">${ini(n)}</div>`;
function leftCol(){
  const m=S.me;
  return `<aside class="left side stack">
   <div class="card" style="padding:6px 6px 18px"><div class="pcover"></div>
    <div style="padding:0 12px">${av(m.name,'lg')}
     <div style="font-weight:700;font-size:18px;margin-top:6px">${esc(m.name)}</div>
     <div class="muted small">${esc(m.role)}</div>
     <div class="chips" style="margin-top:10px">${m.skills.slice(0,3).map(s=>`<span class="chip amber">${esc(s)}</span>`).join('')}</div>
     <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px">
      <div class="stat"><span class="muted">Connections</span><b>${S.connected.length+48}</b></div>
      <div class="stat"><span class="muted">Applications</span><b>${S.applied.length}</b></div>
      <div class="stat"><span class="muted">Saved jobs</span><b>${S.saved.length}</b></div>
     </div>
     <button class="btn ghost sm" style="width:100%;margin-top:10px" onclick="go('me')">View my Bar Card</button>
    </div></div>
   <div class="venue-teaser"><span class="eyebrow">MEET OFFLINE</span><h3>Your people.<br>Your local.</h3><p class="small muted">A different room in every partner bar.</p><button class="btn ghost sm" onclick="go('venue')">◉ At the bar →</button></div><div class="card"><h3 class="sec">Hiring?</h3><p class="small muted">Post a gig or a full-time role. It goes live right away.</p>
    <button class="btn pri sm" style="width:100%;margin-top:12px" onclick="postJobModal()">+ Post a job</button></div>
  </aside>`;
}
function rightCol(){
  const gigs=S.jobs.filter(j=>j.type==='gig').slice(0,3);
  return `<aside class="right side stack">
   <div class="card"><div class="live"><i></i>Live gigs</div>
    ${gigs.map(j=>`<div class="trend" onclick="applyModal('${j.id}')"><b>${esc(j.title)}</b><div class="small muted">${esc(j.city)} · <span style="color:var(--lime)">${esc(j.pay)}${esc(j.per)}</span></div></div>`).join('')}
    <button class="btn ghost sm" style="width:100%;margin-top:10px" onclick="go('gigs')">See all gigs →</button></div>
   <div class="card"><h3 class="sec">People in your industry</h3>
    ${S.people.map(p=>{const c=S.connected.includes(p.name);return `<div class="person">${av(p.name)}<div class="info"><div style="font-weight:600">${esc(p.name)}</div><div class="small muted">${esc(p.role)}</div></div><button class="btn sm ${c?'done':'ghost'}" onclick="connect('${esc(p.name)}')">${c?'✓':'+ Connect'}</button></div>`}).join('')}
   </div>
   <div class="card"><h3 class="sec">Trending in Lounges</h3>
    ${S.threads.slice(0,4).map(t=>`<div class="trend" onclick="openThreadFromAny(${t.id})"><b class="small">${esc(t.title)}</b><div class="small muted">${S.lounges.find(l=>l.id===t.lounge).name} · ${t.replies.length} replies</div></div>`).join('')}
   </div>
  </aside>`;
}

/* ============ FEED ============ */
function feedView(){
  let posts=S.posts.filter(p=>feedTag==='All'||p.tag===feedTag);
  if(query)posts=posts.filter(p=>(p.body+p.name+p.role).toLowerCase().includes(query));
  return `<section class="stack">
   <div class="card composer">
    <div class="row" style="align-items:flex-start">${av(S.me.name)}<textarea id="pbody" placeholder="Share a recipe, a win, a question, or who's hiring…"></textarea></div>
    <div class="row between" style="margin-top:10px;flex-wrap:wrap;gap:10px">
     <div class="tagpick">${TAGS.map(t=>`<button class="${postTag===t?'on':''}" onclick="postTag='${t}';render(true)">#${t}</button>`).join('')}</div>
     <button class="btn pri sm" onclick="addPost()">Post</button>
    </div>
   </div>
   <div class="filter">${['All',...TAGS].map(t=>`<button class="${feedTag===t?'on':''}" onclick="feedTag='${t}';render(true)">${t}</button>`).join('')}</div>
   ${posts.length?posts.map(postCard).join(''):'<div class="card empty">No posts here yet. Be the first! 🍹</div>'}
  </section>`;
}
function postCard(p){
  const open=openComments[p.id];
  return `<article class="card post">
   <div class="row">${av(p.name)}<div style="flex:1"><div style="font-weight:700">${esc(p.name)}</div><div class="small muted">${esc(p.role)} · ${p.time}</div></div><span class="chip amber">#${esc(p.tag)}</span></div>
   <div class="body">${esc(p.body)}</div>
   <div class="small muted">🍻 ${p.likes} cheers · ${p.comments.length} comments</div>
   <div class="actions">
    <button class="act ${p.liked?'on':''}" onclick="like('${p.id}')">🍻 ${p.liked?'Cheered':'Cheers'}</button>
    <button class="act" onclick="toggleC('${p.id}')">💬 Comment</button>
    <button class="act" onclick="share('${p.id}')">↗ Share</button>
   </div>
   ${open?`<div class="comments">${p.comments.map(c=>`<div class="cmt"><b>${esc(c.name)}</b><div>${esc(c.text)}</div></div>`).join('')}
    <div class="cin"><input id="c${p.id}" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')addC('${p.id}')"><button class="btn pri sm" onclick="addC('${p.id}')">Send</button></div></div>`:''}
  </article>`;
}
function addPost(){const b=document.getElementById('pbody').value.trim();if(!b)return toast('Write something first ✍️');
  const np={id:Date.now(),name:S.me.name,role:S.me.role,tag:postTag,time:'now',likes:0,liked:false,body:b,comments:[]};S.posts.unshift(np);save();render(true);toast('Posted to the feed 🎉');if(sbUser)sb.from('posts').insert({user_id:sbUser.id,author_name:S.me.name,author_role:S.me.role,tag:postTag,body:b}).select().single().then(({data})=>{if(data){np.id=data.id;np.cloud=true;save();render(true)}})}
function like(id){const p=S.posts.find(x=>String(x.id)===String(id));if(!p)return;p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render(true);if(p.cloud&&sbUser)sb.from('posts').update({likes:p.likes}).eq('id',p.id).then(()=>{})}
function toggleC(id){openComments[id]=!openComments[id];render(true);setTimeout(()=>document.getElementById('c'+id)?.focus(),0)}
function addC(id){const i=document.getElementById('c'+id);const t=i.value.trim();if(!t)return;const p=S.posts.find(x=>String(x.id)===String(id));if(!p)return;p.comments.push({name:S.me.name,text:t});save();render(true);setTimeout(()=>document.getElementById('c'+id)?.focus(),0);if(p.cloud&&sbUser)sb.from('post_comments').insert({post_id:p.id,user_id:sbUser.id,author_name:S.me.name,body:t}).then(()=>{})}
function share(id){navigator.clipboard?.writeText(location.href.split('#')[0]+'#post-'+id);toast('Link copied 🔗')}

/* ============ JOBS ============ */
function jobsView(){
  let list=S.jobs.filter(j=>j.type===jobType&&(city==='All cities'||j.city===city)&&(role==='All roles'||j.role===role));
  if(query)list=list.filter(j=>(j.title+j.co+j.city+j.role+j.tags.join(' ')).toLowerCase().includes(query));
  const isGig=jobType==='gig';
  return `<section class="stack">
   <div class="card" style="background:var(--card2)">
    ${isGig?'<div class="live"><i></i>Hiring tonight</div>':''}
    <div class="display" style="font-size:44px">${isGig?'Gigs: pick up a shift':'Jobs: build a career'}</div>
    <p class="muted" style="margin-top:6px">${isGig?'One-night events, weekend pop-ups and festival crews. Paid per shift, apply in one tap.':'Full-time roles at bars, hotels, restaurants and spirits brands, in India and abroad.'}</p>
   </div>
   <div class="toolbar">
    <div class="seg"><button class="${isGig?'on':''}" onclick="jobType='gig';view='gigs';render()">⚡ Gigs</button><button class="${!isGig?'on':''}" onclick="jobType='full';view='jobs';render()">💼 Long-term</button></div>
    <select onchange="city=this.value;render(true)">${CITIES.map(c=>`<option ${c===city?'selected':''}>${c}</option>`).join('')}</select>
    <select onchange="role=this.value;render(true)">${ROLES.map(c=>`<option ${c===role?'selected':''}>${c}</option>`).join('')}</select>
    <button class="btn pri sm" style="margin-left:auto" onclick="postJobModal()">+ Post a job</button>
   </div>
   <div class="small muted">${list.length} ${isGig?'gigs':'jobs'} found</div>
   <div class="jobs-grid">${list.length?list.map(jobCard).join(''):'<div class="card empty">No matches. Try another city or role.</div>'}</div>
  </section>`;
}
function jobCard(j){
  const ap=hasId(S.applied,j.id),sv=hasId(S.saved,j.id);
  return `<article class="card job ${j.type}">
   <div class="logo-sq">${j.emoji}</div>
   <div><h4>${esc(j.title)}</h4><div class="muted small">${esc(j.co)} · 📍 ${esc(j.city)} · ${esc(j.when)} · ${j.posted} ago</div>

function filtersModal(){const v=activeVenue();if(!v)return;const all=netPeople().filter(p=>!blockedMembers.has(p.id));const P=venueSession.persona;const vibe=all.filter(p=>P.tags.some(t=>(p.topic+' '+p.role).toLowerCase().includes(t.toLowerCase().split(' ')[0].slice(0,5))));const opts=[['global','🌐 Everyone on the grid','every node live right now',all.length],['venue','🍺 Same bar · '+v.name,'people physically in this venue',all.filter(p=>p.venueId===v.id).length],['vibe','📍 Same vibe','matches tonight\'s persona tags',vibe.length]];modal(`<div class="venue-title"><span class="eyebrow">◎ ROOM FILTERS</span><button class="icon-btn" aria-label="Close filters" onclick="closeModal()">✕</button></div>${opts.map(o=>`<button class="filter-opt ${netFilter===o[0]?'on':''}" onclick="netFilter='${o[0]}';closeModal();render(true)"><span><b style="font-size:14px">${o[1]}</b><small>${o[2]}</small></span><b>${o[3]}</b></button>`).join('')}<p class="small muted" style="margin-top:14px">Filters run live against the mesh · switching is instant, nobody gets notified. (Demo data.)</p>`)}
function toggleChat(){chatOpen=!chatOpen;renderChat()}
function openVenueChat(channel){const v=activeVenue();if(!v){chatOpen=true;renderChat();return}if(channel!=='room'&&(!findPerson(channel)||blockedMembers.has(channel)))return;chatChannel=channel;chatOpen=true;renderChat()}
function renderChat(){const panel=document.getElementById('chatPanel');if(!panel)return;const v=activeVenue();document.getElementById('chatStatus').textContent=v?'Demo · '+v.name:'Locked';panel.hidden=!chatOpen;if(!chatOpen)return;
const head=`<header class="chat-head"><div><b>◉ At the bar</b><div class="small muted">${v?esc(v.name)+' · Emulated session':'Venue-only conversations'}</div></div><button class="icon-btn" title="Close chat" aria-label="Close chat" onclick="toggleChat()">✕</button></header>`;
if(!v){panel.innerHTML=head+`<div class="chat-lock"><div class="lock-symbol">⌑</div><h2>This room stays at the bar.</h2><p>Chat becomes available only on a partner venue’s JOBZ.BAR captive portal. Outside that network, conversations stay locked.</p><button class="btn pri" onclick="go('venue');chatOpen=false;renderChat()">Explore sample venues →</button><span class="small muted">Hackathon preview · Portal emulation</span></div>`;return}
const member=chatChannel==='room'?null:findPerson(chatChannel);const messages=venueMessages.filter(m=>m.channel===chatChannel&&(chatChannel!=='room'||m.venueId===v.id));
panel.innerHTML=head+`<div class="chat-channel"><select aria-label="Chat conversation" onchange="openVenueChat(this.value)"><option value="room">${esc(v.name)} room · Public</option>${netPeople().filter(p=>!blockedMembers.has(p.id)).map(p=>`<option value="${p.id}" ${chatChannel===p.id?'selected':''}>${chatTurns[p.id]?'● ':''}${p.name} · ${p.venueName}</option>`).join('')}</select>${member?`<button class="icon-btn" title="Block this demo member" aria-label="Block member" onclick="blockMember('${member.id}')">⊘</button>`:''}</div><div class="chat-log">${messages.length?messages.map(m=>`<div class="message ${m.own?'own':''}"><small>${esc(m.name)}${m.scripted?' · Scripted demo reply':''}</small><p>${esc(m.text)}</p></div>`).join(''):`<p class="small muted">A new conversation with ${esc(member?member.name+' at '+member.venueName+', '+member.city:'the room')}. Replies here are scripted for the demo.</p>`}</div><form class="chat-compose" onsubmit="event.preventDefault();sendVenueMessage()"><input id="venue-message" aria-label="Venue message" maxlength="1000" placeholder="${member?'Say hello…':'Message this venue…'}" autocomplete="off"><button class="btn pri" type="submit" aria-label="Send venue message">↑</button></form><div class="chat-foot">Emulated access · Messages clear on exit · <button onclick="exitVenueModal()">Leave venue</button></div>`;
const log=panel.querySelector('.chat-log');if(log)log.scrollTop=log.scrollHeight}
function sendVenueMessage(){const v=activeVenue();const input=document.getElementById('venue-message');if(!v||!input){renderChat();return}const text=input.value.trim();if(!text)return;if(text.length>1000)return toast('Keep messages under 1,000 characters');const channel=chatChannel;const person=channel==='room'?null:findPerson(channel);if(channel!=='room'&&(!person||blockedMembers.has(channel)))return;venueMessages.push({venueId:v.id,channel,name:myName(),text,own:true});if(person){chatTurns[channel]=(chatTurns[channel]||0)+1}renderChat();if(view==='venue')render(true);document.getElementById('venue-message')?.focus();if(!person)return;const session=venueSession;const n=chatTurns[channel]-1;const timer=setTimeout(()=>{pendingReplies.delete(timer);if(venueSession!==session||!venueAllowed(session,v.id)||blockedMembers.has(channel))return;const t=REPLIES[n%REPLIES.length].replace('{topic}',person.topic.toLowerCase()).replace('{venue}',person.venueName);venueMessages.push({venueId:v.id,channel,name:person.name,text:t,scripted:true});renderChat()},850);pendingReplies.add(timer)}
function blockMember(id){const v=activeVenue();if(!v||!findPerson(id))return;blockedMembers.add(id);delete chatTurns[id];venueMessages=venueMessages.filter(m=>m.channel!==id);chatChannel='room';renderChat();if(view==='venue')render(true);toast('Demo member blocked for this session')}
function clearVenueTimers(){pendingReplies.forEach(clearTimeout);pendingReplies.clear()}
function recapFor(id){const p=findPerson(id);const turns=chatTurns[id]||0;const depth=turns>=4?'Deep conversation':turns>=2?'Good exchange':'Brief intro';return {p,turns,text:`${depth} with ${p.name} (${p.role}) at ${p.venueName}, ${p.city.split(',')[0]}. You talked about ${p.topic.toLowerCase()}.`}}
function exitVenueModal(){const v=activeVenue();if(!v){disconnectVenue();return}const ids=Object.keys(chatTurns).filter(id=>findPerson(id));const sent=venueMessages.filter(m=>m.own).length;const cities=new Set(ids.map(id=>findPerson(id).city)).size;modal(`<span class="eyebrow">NIGHT RECAP · ${esc(myName())} @ ${v.name}</span><h2 style="margin-top:10px">Good company. Until next time.</h2><div class="session-summary"><div><b>${sent}</b><span class="small muted">Messages</span></div><div><b>${ids.length}</b><span class="small muted">People</span></div><div><b>${cities}</b><span class="small muted">Cities</span></div></div>${ids.length?ids.map(id=>{const r=recapFor(id);const done=S.connected.includes(r.p.name);return `<div class="recap-card"><div class="row">${av(r.p.name)}<div style="flex:1"><b>${r.p.name}</b><p class="small muted">${esc(r.text)}</p></div><label class="tagpick"><input type="checkbox" class="recap-keep" value="${esc(r.p.name)}" ${done?'checked disabled':'checked'}>${done?'Connected':'Keep'}</label></div></div>`}).join(''):'<p class="small muted">No one-to-one chats tonight. Tap in to someone before you go!</p>'}<p class="small muted" style="margin-top:12px">Ending the session closes every chat and locks it. People you keep become JOBZ.BAR connections on your Bar Card — so tonight’s chat can turn into tomorrow’s shift. (Sample recap · nothing is emailed.)</p><div class="row" style="margin-top:20px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">Stay here</button><button class="btn pri" onclick="keepRecap();disconnectVenue()">End night & save connections</button></div>`)}
function keepRecap(){const k=[...document.querySelectorAll('.recap-keep:checked:not(:disabled)')].map(x=>x.value);k.forEach(n=>{if(!S.connected.includes(n))S.connected.push(n)});if(k.length){save();setTimeout(()=>toast(k.length+' new connection'+(k.length>1?'s':'')+' saved 🤝'),2300)}}
function disconnectVenue(){clearVenueTimers();venueSession=null;venueMessages=[];chatTurns={};blockedMembers.clear();chatChannel='room';closeModal();render(true);renderChat();toast('Session ended · Chat locked')}
window.addEventListener('offline',()=>{if(venueSession)disconnectVenue()});
setInterval(()=>{if(venueSession&&!venueAllowed(venueSession,venueSession.venueId)){disconnectVenue()}},1000);

    {q:"What is barrel aging of cocktails and what effect does it have?",opts:["Keeping cocktails in a fridge barrel","Resting pre-batched cocktails in small oak barrels to develop complexity, softness, and vanilla/woody notes","Serving cocktails in barrel-shaped glasses","A marketing technique only"],ans:1,exp:"Barrel-aged cocktails (Negroni, Manhattan) are batched and rested in small oak casks. The wood imparts vanilla, tannin, and caramel notes while softening harsh alcohol — creating complexity unavailable with fresh mixing."},
    {q:"What is the correct method to rim a margarita glass with salt?",opts:["Wet the entire glass then dip","Wet only the outer rim with lime/water, then dip in salt — leaving inside clean","Pour salt directly in the glass","Use a dry glass and press into wet salt"],ans:1,exp:"Rim only the OUTER edge. The inside should stay clean so salt doesn't fall into the drink and over-salt it. Use lime juice (authentic) or water. Half-rim is also offered for those who prefer choice."},
    {q:"What is a 'phantom' pour in bar stock management?",opts:["A very light pour","Unaccounted loss of alcohol through theft, spillage, or over-pouring that isn't tracked","A ghost cocktail on the menu","A pour done without the customer watching"],ans:1,exp:"Phantom pours represent shrinkage — the gap between theoretical inventory (calculated from sales) and actual inventory. Bars target under 1-2% shrinkage. High phantom rates indicate theft or control issues."},
    {q:"What is the difference between a 'wet' and 'dry' martini?",opts:["Temperature difference only","Wet = more vermouth; Dry = less vermouth. Extra dry = a whisper of vermouth","Wet = stirred; Dry = shaken","Wet = with olive; Dry = without"],ans:1,exp:"The wet/dry spectrum refers to vermouth quantity. A wet martini has more vermouth (softer, less spirit-forward). A dry martini has very little. Extra dry = almost no vermouth. Understanding this unlocks personalized service."},
    {q:"What is upselling in a bar context and why is it important?",opts:["Selling more drinks than the customer wants","Suggesting a premium spirit over the well option (e.g., 'Would you like Macallan or house scotch?'), increasing revenue and guest satisfaction","Charging more than the menu price","Selling merchandise alongside drinks"],ans:1,exp:"Upselling improves revenue per cover and often improves guest experience. Suggesting a premium spirit the customer will enjoy more is genuine hospitality — not manipulation. It's a key metric for bar staff performance."},
    {q:"What does P&L stand for and why does a bar manager need to understand it?",opts:["Pour and Liquor report","Profit and Loss statement — shows revenue, costs, and net profit over a period","Product and Licensing document","Payroll and Labor schedule"],ans:1,exp:"The P&L (Profit & Loss) statement is the primary financial document showing a bar's revenue, COGS, labor costs, overheads, and profit. Bar managers must read and influence P&L to run a sustainable operation."},
    {q:"What is the key characteristic of a single malt Scotch whisky?",opts:["Made from a single grain at multiple distilleries","Made from 100% malted barley at a single distillery","Made from a single barrel only","Made in a single year"],ans:1,exp:"Single malt Scotch must be: made from only malted barley, produced at a single distillery, and aged in Scotland for minimum 3 years. The 'single' refers to the distillery — not the barrel or vintage."},
    {q:"What is a 'soigné' customer in hospitality?",opts:["A difficult or complaining customer","A well-groomed, elegant customer who demands and appreciates meticulous service","A regular customer who tips well","A VIP customer on the reservation list"],ans:1,exp:"'Soigné' (French for 'carefully done') describes an elegantly presented guest who expects polished, attentive service. In fine dining bars, recognizing and elevating service for soigné guests is a mark of professional skill."},
    {q:"What does 'on the fly' mean in restaurant and bar terminology?",opts:["A cocktail garnished with a fly","Needed immediately — urgent preparation required right now","A cocktail served over crushed ice","An error to be corrected later"],ans:1,exp:"'On the fly' means immediate urgency — prepare and send this right now. 'Two Martinis on the fly' means the bartender must stop everything and prioritize those drinks. Time-critical communication in busy service."},
    {q:"What is a 'fire' in kitchen-bar terminology?",opts:["An emergency evacuation","The command to start preparing a dish or drink that should go out next","The grill station","A flaming cocktail preparation"],ans:1,exp:"'Fire' is the command from the expeditor or manager to begin preparation of an item that will be served next. It synchronizes the bar and kitchen to ensure all items at a table arrive together."},
    {q:"What is 'complementary' policy in bar management?",opts:["Items that pair well together","Free drinks given to VIPs, repeat customers, or to resolve service issues — tracked to manage cost","The bar's music policy","A system for matching wines to food"],ans:1,exp:"Comp (complementary) drinks are given for VIP relationships, error recovery, or hospitality. Every comp must be tracked and approved to control cost. Uncontrolled comps destroy bar profitability."},
    {q:"What is the responsible way to handle an intoxicated customer who wants another drink?",opts:["Quietly serve a weaker version","Flatly refuse and ask them to leave","Politely inform them service is no longer possible, offer water and food, help arrange safe transportation","Give the drink and let them decide"],ans:2,exp:"RSA best practice: refuse further alcohol, offer water and food, maintain dignity, and assist with safe transport. Aggressive refusal risks confrontation; passive serving risks liability. Hospitality through care is the standard."},
    {q:"What characterizes a 'craft cocktail' versus a standard cocktail?",opts:["Any cocktail made quickly","A cocktail made with fresh ingredients, house-made syrups, artisanal spirits, and intentional technique — emphasizing quality over speed","Any cocktail costing over ₹800","A cocktail made by a certified mixologist only"],ans:1,exp:"Craft cocktails prioritize fresh, seasonal ingredients, house-made components (syrups, bitters, shrubs), quality spirits, and precise technique. The craft movement elevated bartending to culinary artistry."},
    {q:"What is a 'responsible pour' and what is the standard measure in most Indian hospitality properties?",opts:["Any pour the bartender feels is reasonable","A legally/policy-defined measure — typically 30ml or 60ml in Indian licensed properties","A pour that doesn't spill","A pour of only premium spirits"],ans:1,exp:"Indian licensed F&B properties typically use 30ml or 60ml standard measures per serve. Consistent pours ensure cost control, responsible consumption, and legal compliance. Variability in pours directly impacts profitability."},
    {q:"What is a 'wine back vintage' and why does it matter for sommelier service?",opts:["Old wine that has gone bad","A wine produced in a particularly good or poor agricultural year — vintage quality affects pricing, aging potential, and recommendation","Any wine from before 2000","A wine stored in the back cellar"],ans:1,exp:"Vintage matters because weather conditions during growing season dramatically affect wine quality. A great vintage (e.g., Bordeaux 2000, Barolo 1997) commands premium pricing and aging ability — essential sommelier knowledge."},
    {q:"What is 'terroir' in wine and spirits production?",opts:["A French word for territory only","The complete natural environment (soil, climate, topography) that gives a product its unique character","The winemaker's technique","The age of the vines"],ans:1,exp:"Terroir (French for 'earth') encapsulates how soil composition, microclimate, altitude, and geography shape a wine or spirit's character. Two vineyards 100 meters apart can produce dramatically different wines. Core sommelier concept."},
    {q:"How should a bar manager handle a supplier price increase while maintaining pour cost targets?",opts:["Accept it and increase menu prices","Review which items can be substituted, renegotiate with suppliers, adjust cocktail recipes, and selectively increase menu prices","Stop ordering that product","Reduce pour sizes secretly"],ans:1,exp:"Price increases require a multi-lever approach: supplier negotiation, recipe reformulation using comparable alternatives, portion review, and strategic menu price adjustments. Transparency with the team on cost pressures is management best practice."},

  senior: [
    {q:"What is the difference between 'on-trade' and 'off-trade' in alcohol distribution?",opts:["On-trade is expensive; off-trade is cheap","On-trade is alcohol sold for immediate consumption (bars, hotels); off-trade is sold for consumption elsewhere (liquor stores, retail)","On-trade is legal; off-trade is not","On-trade is premium; off-trade is economy"],ans:1,exp:"This distinction is fundamental to brand strategy. On-trade (HoReCa) builds brand image and premium positioning. Off-trade drives volume. Most alcohol companies manage separate teams and strategies for each channel."},
    {q:"In Indian alcohol regulation, what is the difference between IMFL and FL?",opts:["There is no difference","IMFL (Indian Made Foreign Liquor) is domestically produced spirits above 42ml; FL (Foreign Liquor) is imported","IMFL is cheaper; FL is premium","IMFL is for retail; FL is for bars only"],ans:1,exp:"IMFL refers to liquor produced in India but in the style of foreign liquors (whisky, vodka, etc.). FL is actually imported spirit. Excise duty structures, licensing, and pricing differ significantly between categories — critical for corporate bar compliance."},
    {q:"What is a '3-tier distribution system' in the US alcohol industry?",opts:["Three sizes of bottles","Producer → Distributor → Retailer — a legally mandated separation post-Prohibition","Three tax tiers","Three price points"],ans:1,exp:"Post-Prohibition, the US mandated a 3-tier system: producers must sell to distributors, who sell to retailers/bars. This prevents vertical integration and theoretically prevents monopolies. Understanding this is essential for brand export strategy."},
    {q:"What does a Brand Ambassador's role primarily involve in the alcohol industry?",opts:["Making cocktails only","Representing a brand at trade events, building relationships with bartenders and buyers, conducting tastings, and driving brand advocacy and listings","Social media management only","Running the brand's factory"],ans:1,exp:"A Brand Ambassador (BA) is the human embodiment of a brand. Core duties: trade education, bartender training, account visits, event hosting, and influencing purchasing decisions. This role combines sales, education, and hospitality expertise."},
    {q:"What is 'below the line' (BTL) marketing in the alcohol industry?",opts:["Advertising below eye level","Targeted promotional activities (trade shows, POS displays, sponsorships, in-bar activations) versus mass media (ATL)","Illegal or covert marketing","Marketing to budget customers"],ans:1,exp:"BTL marketing is direct, targeted promotion: bar activations, cocktail sponsorships, POS material, events, and sampling. It complements ATL (Above The Line) mass media and is often more effective for premium spirits building on-trade credibility."},
    {q:"What is 'dark market' advertising regulation in alcohol?",opts:["Advertising after midnight only","A jurisdiction where alcohol advertising is legally prohibited or severely restricted (e.g., some Indian states)","Advertising on dark-themed platforms","Advertising in nightclubs only"],ans:1,exp:"Several Indian states and countries prohibit direct alcohol advertising. Brands navigate this through surrogate advertising, content marketing, event sponsorship, and ATL advertising via related non-alcohol products (music CDs, water, etc.)."},
    {q:"What is 'surrogate advertising' and how is it used in the Indian alcohol industry?",opts:["Advertising using a stand-in spokesperson","Promoting a non-alcohol product under the same brand name to create brand awareness — e.g., 'Royal Stag Music CDs'","Illegal advertising practices","Advertising through social media influencers"],ans:1,exp:"Indian regulations restrict direct alcohol advertising. Brands use surrogate products (soda water, music, packaged water) bearing the same brand name to maintain consumer recall. This is legally ambiguous and regulatory scrutiny is increasing."},
    {q:"What is a 'listing fee' in the context of hotel and restaurant bar management?",opts:["A fee to list on Zomato","A fee paid by a brand/supplier to have their product included on a venue's drinks menu","A sommelier certification fee","A fee for creating cocktail menus"],ans:1,exp:"Listing fees are common in premium hospitality: brands pay to secure placement on hotel or club menus. This guarantees visibility and volume commitment. Negotiating listing agreements is a key skill for Brand Ambassadors and Sales Directors."},
    {q:"What is excise duty in the Indian alcohol industry and who sets it?",opts:["A national uniform tax set by the central government","A state-level tax on alcohol production and sale — each Indian state sets its own rates, creating massive price variation across states","Import duty on foreign alcohol only","A quality certification fee"],ans:1,exp:"Excise duty on alcohol is a STATE subject in India's constitution. This means Rajasthan, Maharashtra, and Goa can have dramatically different duty rates. States like UP generate massive excise revenue. Understanding this is essential for P&L planning."},
    {q:"What is the TASMAC model and which Indian state uses it?",opts:["A cocktail menu format","Tamil Nadu's state-owned alcohol retail monopoly — the government controls alcohol production and retail licensing","A bar management software","A type of bar layout"],ans:1,exp:"TASMAC (Tamil Nadu State Marketing Corporation) is the government-owned entity controlling alcohol retail in Tamil Nadu. The state monopoly model generates massive revenue for the government. Understanding state control models affects distribution strategy significantly."},
    {q:"What is a 'dry state' in the Indian context and name three examples?",opts:["A state with no monsoon","A state where the sale and consumption of alcohol is legally prohibited — e.g., Gujarat, Bihar, Mizoram","A state with very few bars","A state with no imported spirits"],ans:1,exp:"Dry states prohibit alcohol sale/consumption. Gujarat (complete prohibition since 1960), Bihar (since 2016), and Mizoram have restrictions. Navigating these for events or hospitality requires special permits. Critical for corporate event planners."},
    {q:"What is 'yield management' in Food & Beverage operations?",opts:["Managing how much food is wasted","Maximizing revenue by adjusting prices based on demand, time, and capacity — e.g., event pricing vs. regular service","Controlling how much alcohol is poured","Tracking produce freshness"],ans:1,exp:"Yield management (revenue management) applies to F&B through variable pricing: event premiums, happy hour discounts, prix fixe menus. In bar events, it involves optimizing bar packages to maximize revenue per guest while delivering value."},
    {q:"How do you calculate ROI for a bar sponsorship activation?",opts:["Number of people who attended","(Revenue or Brand Value Generated − Investment Cost) ÷ Investment Cost × 100","Number of social media posts generated","Amount of product consumed at the event"],ans:1,exp:"ROI = (Returns − Investment) / Investment × 100. For brand activations, returns include direct sales uplift, brand impression value, media coverage value, and listing agreements secured. A strong activation ROI benchmark is 3-5x investment."},
    {q:"What is a 'Key Account Manager' (KAM) and how does their role differ from a standard sales rep?",opts:["A KAM manages a larger territory","A KAM manages strategic high-value accounts with tailored solutions, building long-term partnerships vs. a sales rep's transactional approach","A KAM only manages international accounts","A KAM reports to more senior management"],ans:1,exp:"KAMs own the relationship with highest-value on-trade accounts (5-star hotels, premium clubs). They negotiate listing agreements, co-marketing budgets, exclusive events, and volume commitments — roles requiring deep industry knowledge and relationship skills."},
    {q:"What is a 'route to market' (RTM) strategy in alcohol distribution?",opts:["The physical delivery route for trucks","The strategic plan for how a product moves from producer to consumer — including distributor selection, channel prioritization, and market entry timing","A marketing campaign roadmap","The menu placement strategy"],ans:1,exp:"RTM strategy determines how a brand reaches its target consumer: which distributors, which channels (on/off trade), what pricing tiers, and in which geographic sequence. A strong RTM strategy is the foundation of successful market entry for any alcohol brand."},
    {q:"What is a 'management contract' versus a 'franchise agreement' for running a bar?",opts:["They are the same","Management contract: hotel owner pays a company to operate their F&B; Franchise: operator pays for the right to use a brand's name and systems","Franchise is for international; management is local","Management contract is for small bars; franchise for chains"],ans:1,exp:"Management contracts (common in 5-star hotels) mean the property owner retains financial ownership while a brand operates the space. Franchises grant rights to use a brand's IP and systems for fees/royalties. Both are common in premium bar concepts."},
    {q:"In alcohol import, what does 'CIF' pricing mean for a purchase order?",opts:["Cost Including Fees","Cost, Insurance, and Freight — the seller covers transport, insurance, and loading to the destination port","Customs Import Form","Certificate of Import and Fulfillment"],ans:1,exp:"CIF pricing includes the product cost, insurance during transit, and freight to destination port. The buyer takes risk once goods arrive at port. Understanding CIF vs. FOB (Free On Board) is essential for spirits import procurement."},
    {q:"What is a 'pour audit' and why would a bar owner commission one?",opts:["An audit of the cocktail menu","A systematic check comparing theoretical liquor usage (from sales data) to actual usage to identify over-pouring, spillage, or theft","An inspection of pouring equipment","A customer satisfaction audit on portion sizes"],ans:1,exp:"Pour audits are conducted by independent specialists or internal control teams. They identify variance between what should have been poured (per sales data) and what was actually used. Variance above 2-3% signals serious control problems costing significant revenue."},
    {q:"What is a 'hospitality suite' arrangement in corporate events?",opts:["A room where event staff rest","A premium private space at a corporate event or venue providing exclusive food, beverage, and entertainment for VIP clients — managed with a dedicated bar and service team","Any suite in a hotel","A basic hospitality package"],ans:1,exp:"Hospitality suites are revenue-generating VIP spaces at sporting events, concerts, and corporate conferences. Managing the bar, service levels, inventory, and brand representation in a hospitality suite is a specialized, high-pressure corporate events skill."},
    {q:"What does 'GST' apply to in alcohol sales in India, and what's the key exception?",opts:["GST applies to everything at 28%","Alcohol for human consumption is EXEMPT from GST — it falls under state excise only. However, input materials and services for alcohol production do attract GST","All alcohol attracts 18% GST","Only imported alcohol attracts GST"],ans:1,exp:"This is one of India's most important alcohol tax nuances. Alcohol for human consumption sits outside GST and is governed entirely by state excise. However, beer, wine, and spirits producers cannot claim GST input credits, creating embedded tax costs."},
    {q:"What is 'below-the-lock' pricing in hotel bar contracts?",opts:["Any price below the lock-in threshold","A minimum price that a hotel agrees to charge for a brand — protecting the brand's premium positioning in the market","Pricing for drinks served after the bar closes","A discount pricing tier"],ans:1,exp:"Premium alcohol brands often negotiate minimum pricing floors with hotel partners. This prevents discounting that would damage brand equity. A single malt appearing on a 'buy one get one' undermines its premium positioning permanently — brands protect this fiercely."},
    {q:"What are the critical legal clauses in a Celebrity Brand Ambassador contract for an alcohol brand?",opts:["Only the fee and duration","Exclusivity (competing brands), territory, social media obligations, personal conduct clauses, campaign sign-off rights, and termination triggers (scandal/reputation risk)","Only the social media requirements","The number of events to attend"],ans:1,exp:"Celebrity BA contracts are complex: exclusivity prevents association with competing brands; conduct clauses allow termination if the celebrity's reputation damages the brand; sign-off rights give brand approval over all content. This protects significant marketing investments."},
    {q:"What is a 'corkage negotiation' in a high-value corporate event?",opts:["Negotiating the price of corks","When a client brings their own premium wine or spirits to an event and negotiates the service fee (corkage) — balancing client relationship value against lost beverage revenue for the venue","Negotiating wine list placement","A dispute about bottle opening charges"],ans:1,exp:"Corporate events often involve clients bringing gifted or branded alcohol. Skilled F&B managers negotiate corkage strategically: charging enough to cover service costs while maintaining the client relationship. Rate, service level, and glassware are all negotiated."},
    {q:"What is FIFO vs LIFO in bar stock valuation and which is preferred in hospitality?",opts:["They are the same method","FIFO (First In First Out) uses oldest stock cost first — preferred in hospitality as it reflects actual stock movement and prevents spoilage. LIFO (Last In First Out) is used in some accounting contexts.","LIFO is always preferred in bars","Neither applies to beverage stocks"],ans:1,exp:"FIFO is the correct method for perishable and rotating beverage stock. It ensures oldest bottles are used first (preventing spoilage) and reflects actual cost of goods sold. LIFO would theoretically defer taxes but is impractical for physical stock rotation."},
    {q:"What is a 'brand takeover' event and what metrics define its success?",opts:["One brand buying another brand","An event where a single alcohol brand takes complete control of a venue's atmosphere, menu, and experience for a defined period — success measured by volume uplift, impressions, and listing agreements secured","A hostile corporate acquisition","A brand changing its visual identity"],ans:1,exp:"Brand takeovers are high-investment activations: the brand controls décor, music, menu, staff training, and service style. ROI metrics include: volume sold at event, media impressions, new listings secured post-event, social media reach, and wholesale uplift in the following month."},
    {q:"What is an 'event contract' in the alcohol industry context, and what should it always include?",opts:["Just the dates and fee","A legal agreement between an alcohol brand/supplier and an event organizer — must include: exclusivity terms, approved products, minimum purchase commitments, pouring rights, branding rights, liability clauses, and payment terms","Only the catering agreement","A marketing partnership only"],ans:1,exp:"Event contracts (pouring rights) are significant commercial agreements. A beer brand might pay to be the exclusive beer served at a festival in exchange for guaranteed volume and prominent branding. Missing key clauses (liability, exclusivity breach penalties) can result in significant financial loss."},
    {q:"What is the role of a Cellar Master in a large hospitality property?",opts:["A master who works in the cellar","The senior professional responsible for wine selection, purchasing, cellar management (temperature, humidity, rotation), staff training, and achieving beverage revenue and COGS targets for the wine program","A person who tastes all wines before service","A wine delivery manager"],ans:1,exp:"The Cellar Master (or Head Sommelier/Beverage Director) is a senior leadership role. Beyond wine knowledge, they manage a significant inventory investment, negotiate supplier terms, develop staff, create wine lists that support both guest experience and financial targets."},
    {q:"What is 'responsible marketing' in the context of alcohol brand communications?",opts:["Marketing with a budget","Ensuring all brand communications comply with industry self-regulatory codes (e.g., ASCI in India, DISCUS in US) — no targeting of under-18s, no health claims, no association with driving, no aspirational claims for heavy drinking","Responsible spending on marketing","Marketing that uses recycled materials"],ans:1,exp:"Alcohol brands must adhere to self-regulatory codes globally. In India, the ASCI code restricts direct alcohol advertising. Brands must avoid content that targets minors, glamorizes excess consumption, or implies alcohol improves social/sexual success. Violations risk regulatory action and reputational damage."},
    {q:"How does a bar/hospitality company structure an effective alcohol brand partnership for a new property launch?",opts:["Simply select whatever brands are cheapest","Develop a beverage program first (concept-driven), then approach brands whose identity aligns with the property positioning — negotiate listing agreements, bar fixtures/furniture support, staff training, co-branded events, and launch-event sponsorship in exchange for volume commitments","Accept whichever brand offers the most free bottles","Let the head bartender choose their favorite brands"],ans:1,exp:"Strategic brand partnerships are built on alignment: a craft cocktail bar partners with artisanal spirit brands; a sports bar partners with mainstream beer brands. The negotiation should yield value on both sides — brand gets visibility and volume; property gets support, training, and often equipment/fit-out contribution."},
    {q:"What is the process for obtaining a bar license in a new state in India?",opts:["Simply apply online and pay a fee","Apply to the State Excise Department with: company registration, FBO license (if food), property lease/ownership documents, police clearance, fire NOC, building plan approval, and pay prescribed license fees — processes and timelines vary significantly by state","There is one national bar license","Buy an existing licensed property only"],ans:1,exp:"Liquor licensing in India is entirely state-governed and notoriously complex. States have different license categories (FL-2, FL-3 in some states), quotas (some states cap the number of licenses in an area), and varying annual fees. Legal expertise specific to each state's excise laws is essential for new bar openings."},
