 <div class="bm-grid"><div class="bm-card"><div class="bm-eyebrow">ONE-TIME TEST FEE</div><div class="bm-price">₹${BM_PRICE}</div><p class="small muted">Paid once. No subscription.</p><ul class="bm-list"><li>All 3 tracks · ${total} expert questions</li><li>AI Bar Coach on every wrong answer</li><li>Personal 7-day learning plan</li><li>Retry-what-you-missed practice</li><li>Ask a human mentor</li></ul><button class="bm-btn" style="width:100%" onclick="bmCheckout()">Unlock BAR MODE — ₹${BM_PRICE}</button></div>
 ${BM_TRACKS.map(t=>`<div class="bm-card"><div class="bm-eyebrow">${QUIZ_QUESTIONS[t.k].length} QUESTIONS</div><h3>${t.name}</h3><p class="small muted">${t.who}</p><p style="margin-top:12px;font-size:14px">“${esc(QUIZ_QUESTIONS[t.k][0].q)}”</p></div>`).join('')}</div></section>`}
function bmCheckout(){modal(`<span class="eyebrow">DEMO CHECKOUT · NO REAL MONEY</span><h2 class="display" style="font-size:40px;margin:10px 0 4px">BAR MODE</h2><p class="muted small">One-time test fee · all tracks · AI coach</p><div class="display" style="font-size:64px;margin:14px 0">₹${BM_PRICE}</div><p class="small muted">This prototype simulates payment. A live payment step (e.g. Pine Labs) plugs in here before launch.</p><div class="row" style="margin-top:16px;gap:8px"><button class="btn pri" onclick="bmPay()">Pay ₹${BM_PRICE} (demo)</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function bmPay(){BM.paid=true;BM.paidAt=Date.now();bmSave();closeModal();bmMode='bar';render();toast('✦ BAR MODE unlocked — welcome in');if(sbUser)sb.from('barmode_unlocks').upsert({user_id:sbUser.id,amount_inr:BM_PRICE,provider:'demo'}).then(()=>{})}
function bmHome(sw){const days=bmStreakDays();const last=BM.attempts[BM.attempts.length-1];const miss=bmMissedCount();
 return `<section class="bm">${sw}<div class="bm-row" style="justify-content:space-between"><div><div class="bm-eyebrow">BAR MODE · MEMBER</div><h1 class="bm-title">Your learning <em>bar</em></h1></div><span class="bm-demo">₹${BM_PRICE} · PAID ONCE</span></div>
 <div class="bm-grid"><div class="bm-card"><div class="small muted">Tests taken</div><div class="bm-stat">${BM.attempts.length}</div></div><div class="bm-card"><div class="small muted">Last score</div><div class="bm-stat">${last?Math.round(last.score/last.total*100)+'%':'—'}</div></div><div class="bm-card"><div class="small muted">To revisit</div><div class="bm-stat">${miss}</div></div>
 <div class="bm-card" style="grid-column:span 2;min-width:0"><div class="small muted">Your first week</div><div class="bm-days">${days.map((on,i)=>`<span class="${on?'on':''}">D${i+1}</span>`).join('')}</div><p class="small muted" style="margin-top:8px">${days.filter(Boolean).length}/7 days practised</p></div></div>
 <h3 class="display" style="font-size:30px;margin:26px 0 4px">Pick a track</h3><div class="bm-grid">${BM_TRACKS.map(t=>{const b=bmBest(t.k);return `<div class="bm-card"><div class="bm-eyebrow">${QUIZ_QUESTIONS[t.k].length} QUESTIONS</div><h3>${t.name}</h3><p class="small muted">${t.who}</p><div class="bm-bar" style="margin:12px 0"><i style="width:${b||0}%"></i></div><p class="small muted">${b===null?'Not attempted':'Best '+b+'%'}</p><button class="bm-btn" style="margin-top:10px;width:100%" onclick="bmStart('${t.k}')">${b===null?'Start test':'Retake'}</button>${(BM.missed[t.k]||[]).length?`<button class="bm-ghost" style="margin-top:8px;width:100%" onclick="bmStart('${t.k}',true)">Practise ${BM.missed[t.k].length} missed</button>`:''}</div>`}).join('')}</div>
 <div class="bm-card" style="margin-top:18px"><div class="bm-row" style="justify-content:space-between"><div><h3>Ask a human mentor</h3><p class="small muted">Stuck on something the AI can't settle? A senior bartender replies within 24h.</p></div><button class="bm-ghost" onclick="bmMentor()">Ask a mentor</button></div>${BM.mentor.length?`<ul class="bm-list">${BM.mentor.map(m=>`<li>${esc(m.q)} <span class="small muted">· ${m.status}</span></li>`).join('')}</ul>`:''}</div></section>`}
function bmStart(k,missedOnly){const all=QUIZ_QUESTIONS[k];const idx=missedOnly?[...(BM.missed[k]||[])]:all.map((_,i)=>i);if(!idx.length)return;bmQuiz={track:k,idx,pos:0,score:0,answers:[],missedOnly:!!missedOnly,done:false};render();window.scrollTo({top:0,behavior:'smooth'})}
function bmQuizView(){const Q=bmQuiz,t=bmTrack(Q.track);if(Q.done)return bmResult();const qi=Q.idx[Q.pos],q=QUIZ_QUESTIONS[Q.track][qi],a=Q.answers[Q.pos];
 return `<section class="bm"><div class="bm-row" style="justify-content:space-between"><div class="bm-eyebrow">${t.name.toUpperCase()}${Q.missedOnly?' · REVISIT':''}</div><button class="bm-ghost" onclick="bmQuit()">Exit</button></div><div class="bm-row" style="margin-top:12px;justify-content:space-between"><span class="small muted">Question ${Q.pos+1} of ${Q.idx.length}</span><span class="small muted">Score ${Q.score}</span></div><div class="bm-bar" style="margin-top:8px"><i style="width:${Q.pos/Q.idx.length*100}%"></i></div>
 <div class="bm-q">${esc(q.q)}</div>${q.opts.map((o,i)=>`<button class="bm-opt ${a!==undefined?(i===q.ans?'ok':i===a?'bad':''):''}" ${a!==undefined?'disabled':''} onclick="bmAnswer(${i})">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}
 ${a!==undefined?`<div class="bm-exp">💡 ${esc(q.exp)}</div>${a!==q.ans?`<div class="bm-ai" id="bm-ai-q"><button class="bm-ghost" onclick="bmExplain()">✦ Ask Bar Coach why I got this wrong</button></div>`:''}<div style="margin-top:14px"><button class="bm-btn" onclick="bmNext()">${Q.pos+1<Q.idx.length?'Next →':'See my results'}</button></div>`:''}</section>`}
function bmAnswer(i){const Q=bmQuiz;if(Q.answers[Q.pos]!==undefined)return;const qi=Q.idx[Q.pos],q=QUIZ_QUESTIONS[Q.track][qi];Q.answers[Q.pos]=i;if(i===q.ans)Q.score++;render(true)}
function bmExplain(){if(bmAiBusy)return;const Q=bmQuiz,q=QUIZ_QUESTIONS[Q.track][Q.idx[Q.pos]];bmCoach({mode:'explain',track:bmTrack(Q.track).name,item:{q:q.q,picked:q.opts[Q.answers[Q.pos]],correct:q.opts[q.ans]}},'bm-ai-q')}
function bmNext(){const Q=bmQuiz;if(Q.pos+1<Q.idx.length){Q.pos++;render();return}bmFinish()}
function bmFinish(){const Q=bmQuiz,qs=QUIZ_QUESTIONS[Q.track];const wrong=Q.idx.filter((qi,p)=>Q.answers[p]!==qs[qi].ans);const right=Q.idx.filter((qi,p)=>Q.answers[p]===qs[qi].ans);
 const prev=new Set(BM.missed[Q.track]||[]);right.forEach(i=>prev.delete(i));wrong.forEach(i=>prev.add(i));BM.missed[Q.track]=[...prev];
 BM.attempts.push({track:Q.track,score:Q.score,total:Q.idx.length,at:Date.now(),revisit:Q.missedOnly});bmSave();Q.done=true;Q.wrong=wrong;render();window.scrollTo({top:0,behavior:'smooth'});if(sbUser){sb.from('barmode_attempts').insert({user_id:sbUser.id,track:Q.track,score:Q.score,total:Q.idx.length,missed:wrong,revisit:Q.missedOnly}).then(()=>{});sb.from('barmode_progress').upsert({user_id:sbUser.id,track:Q.track,missed:BM.missed[Q.track]}).then(()=>{})}}
function bmRank(p){return p>=85?'MASTER MIXOLOGIST':p>=65?'EXPERT PRO':p>=45?'PROFESSIONAL':'ROOKIE'}
function bmResult(){const Q=bmQuiz,t=bmTrack(Q.track),pct=Math.round(Q.score/Q.idx.length*100),qs=QUIZ_QUESTIONS[Q.track];
 return `<section class="bm"><div class="bm-eyebrow">${t.name.toUpperCase()} · RESULT</div><div class="bm-row" style="gap:24px;margin-top:10px"><div class="bm-price">${Q.score}/${Q.idx.length}</div><div><div class="bm-title" style="font-size:40px;margin:0">${bmRank(pct)}</div><p class="muted">${pct}% · ${Q.wrong.length} to revisit</p></div></div>
 <div class="bm-card" style="margin-top:18px"><h3>Your AI learning plan</h3><div class="bm-ai" id="bm-ai-plan">${Q.plan?bmMd(Q.plan):`<button class="bm-btn" onclick="bmPlan()">✦ Build my 7-day plan</button>`}</div></div>
 ${Q.wrong.length?`<div class="bm-card" style="margin-top:14px"><h3>Where you got stuck</h3><ul class="bm-list">${Q.wrong.slice(0,8).map(i=>`<li>${esc(qs[i].q)} <span class="small muted">→ ${esc(qs[i].opts[qs[i].ans])}</span></li>`).join('')}</ul></div>`:''}
 <div class="bm-row" style="margin-top:18px">${Q.wrong.length?`<button class="bm-btn" onclick="bmStart('${Q.track}',true)">Practise my ${Q.wrong.length} misses</button>`:''}<button class="bm-ghost" onclick="bmQuit()">Back to tracks</button><button class="bm-ghost" onclick="bmMentor()">Ask a mentor</button></div></section>`}
async function bmPlan(){if(bmAiBusy)return;const Q=bmQuiz,qs=QUIZ_QUESTIONS[Q.track];const missed=Q.wrong.slice(0,40).map(i=>({q:qs[i].q,picked:qs[i].opts[Q.answers[Q.idx.indexOf(i)]]??'',correct:qs[i].opts[qs[i].ans]}));
 const txt=await bmCoach({mode:'plan',track:bmTrack(Q.track).name,score:Q.score,total:Q.idx.length,missed},'bm-ai-plan');if(txt&&bmQuiz===Q)Q.plan=txt}
function bmQuit(){bmQuiz=null;render()}
function bmMentor(){modal(`<span class="eyebrow">HUMAN IN THE LOOP</span><h2 class="display" style="font-size:36px;margin:10px 0">Ask a mentor</h2><p class="small muted">A senior bartender from the JOBZ.BAR network reviews and replies within 24h.</p><textarea id="bm-mq" rows="4" style="width:100%;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)" placeholder="e.g. How do I speed up my pour accuracy for a busy Friday?"></textarea><div class="row" style="margin-top:12px;gap:8px"><button class="btn pri" onclick="bmSendMentor()">Send to mentor</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function bmSendMentor(){const v=document.getElementById('bm-mq').value.trim();if(!v)return toast('Write your question first');BM.mentor.unshift({q:v.slice(0,300),status:'Waiting for mentor',at:Date.now()});bmSave();closeModal();render(true);toast('Sent to a mentor 🤝');if(sbUser)sb.from('mentor_requests').insert({user_id:sbUser.id,question:v.slice(0,300)}).then(()=>{})}

function render(keepScroll){
  renderNav();
  const main={feed:feedView,gigs:jobsView,jobs:jobsView,lounges:loungesView,me:meView,venue:venueView,learn:learnView}[view]();
  const wide=view!=='feed';if(view==='learn'){document.getElementById('app').innerHTML=`<div class="wrap">${main}</div>`;return}
  document.getElementById('app').innerHTML=`<div class="wrap ${wide?'':''}">${view==='feed'&&!query?hero():''}${leftCol()}${main}${rightCol()}</div>`;
}

/* ============ LOVABLE CLOUD SYNC ============
   Signed-in members get real accounts, a shared feed, shared jobs and
   cloud-saved BAR MODE progress. Signed-out / standalone (GitHub Pages)
   keeps working exactly as before with local demo data. */
const JB_CLOUD={url:'"https://pqlodctqzgvyyufesvmt.supabase.co"',key:'"sb_publishable_xWfmfApPYAbXzO1ydclQPw_GQYlpNML"'};
let sb=null,sbUser=null,sbVenueId=null;
const hasId=(arr,id)=>arr.some(x=>String(x)===String(id));
const isCloudId=id=>typeof id==='string'&&id.length>20;
function renderAuthChip(){const t=document.getElementById('tabs');if(!t)return;document.getElementById('authchip')?.remove();
 const b=document.createElement('button');b.id='authchip';b.className='tab';b.style.marginLeft='6px';
 if(sbUser){b.innerHTML='👤 '+esc((S.me.name||'Me').split(' ')[0])+' · Sign out';b.onclick=()=>{if(confirm('Sign out of JOBZ.BAR?'))window.parent.postMessage({jobzbar:'sign-out'},location.origin)}}
 else{b.innerHTML='🔑 Sign in with Google';b.onclick=()=>{if(window.parent===window){toast('Sign in is available on the hosted app');return}window.parent.postMessage({jobzbar:'google-signin'},location.origin);toast('Opening Google sign-in…')}}
 t.appendChild(b)}
async function cloudInit(){
 try{
  const mod=await import('https://esm.sh/@supabase/supabase-js@2');
  sb=mod.createClient(JB_CLOUD.url,JB_CLOUD.key);
  window.addEventListener('message',async e=>{
   if(e.origin!==location.origin)return;const m=e.data||{};
   if(m.jobzbar==='session'){if(m.session){const {error}=await sb.auth.setSession(m.session);if(!error)cloudOnSession()}else if(sbUser){sbUser=null;sbVenueId=null;renderAuthChip();render(true)}}
  });
  const {data:{session}}=await sb.auth.getSession();
  if(session)await cloudOnSession();else renderAuthChip();
  if(window.parent!==window)window.parent.postMessage({jobzbar:'session-request'},location.origin);
 }catch(e){/* standalone or offline: local demo mode */}
}
async function cloudOnSession(){
 const {data:{user}}=await sb.auth.getUser();if(!user)return;sbUser=user;
 await Promise.all([cloudProfile(),cloudBarmode(),cloudFeed(),cloudJobs(),cloudApplications()]);
 renderAuthChip();render(true);
}
async function cloudProfile(){
 const {data}=await sb.from('profiles').select('*').eq('id',sbUser.id).maybeSingle();
 if(data&&data.name){S.me={name:data.name,role:data.headline,exp:data.experience,bio:data.bio,skills:data.skills||[]};save()}
 else{const nm=sbUser.user_metadata?.full_name||sbUser.email?.split('@')[0]||'Member';await sb.from('profiles').upsert({id:sbUser.id,name:nm});S.me={...S.me,name:nm};save()}
}
async function cloudSaveProfile(){if(!sbUser)return;await sb.from('profiles').upsert({id:sbUser.id,name:S.me.name,headline:S.me.role,experience:S.me.exp,bio:S.me.bio,skills:S.me.skills})}
async function cloudBarmode(){
 const {data:u}=await sb.from('barmode_unlocks').select('*').eq('user_id',sbUser.id).maybeSingle();
 if(u){BM.paid=true;BM.paidAt=new Date(u.unlocked_at).getTime()}
 const {data:at}=await sb.from('barmode_attempts').select('*').eq('user_id',sbUser.id).order('created_at');
 if(at&&at.length)BM.attempts=at.map(a=>({track:a.track,score:a.score,total:a.total,at:new Date(a.created_at).getTime(),revisit:a.revisit}));
 const {data:pr}=await sb.from('barmode_progress').select('*').eq('user_id',sbUser.id);
 if(pr&&pr.length){BM.missed={};pr.forEach(p=>BM.missed[p.track]=p.missed||[])}
 const {data:mr}=await sb.from('mentor_requests').select('*').eq('user_id',sbUser.id).order('created_at',{ascending:false});
 if(mr&&mr.length)BM.mentor=mr.map(m=>({q:m.question,status:m.status,at:new Date(m.created_at).getTime()}));
 bmSave();
}
async function cloudFeed(){
 const {data:posts}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(50);
 if(!posts)return;
 const {data:cmts}=await sb.from('post_comments').select('*').order('created_at');
 const byPost={};(cmts||[]).forEach(c=>{(byPost[c.post_id]=byPost[c.post_id]||[]).push({name:c.author_name,text:c.body})});
 const cloud=posts.map(p=>({id:p.id,name:p.author_name,role:p.author_role,tag:p.tag,time:new Date(p.created_at).toLocaleDateString(),likes:p.likes,liked:false,body:p.body,comments:byPost[p.id]||[],cloud:true}));
 S.posts=[...cloud,...S.posts.filter(p=>!p.cloud)];save();
}
async function cloudJobs(){
 const {data:jobs}=await sb.from('jobs').select('*').order('created_at',{ascending:false}).limit(100);
 if(!jobs)return;
 const cloud=jobs.map(j=>({id:j.id,type:j.type,title:j.title,co:j.company,city:j.city,role:j.role,pay:j.pay,per:j.per,when:j.when_text,emoji:j.type==='gig'?'⚡':'💼',tags:['Member'],posted:'recently',cloud:true}));
 S.jobs=[...cloud,...S.jobs.filter(j=>!j.cloud)];save();
}
async function cloudApplications(){
 const {data}=await sb.from('job_applications').select('job_id').eq('user_id',sbUser.id);
 if(data)data.forEach(a=>{if(!hasId(S.applied,a.job_id))S.applied.push(a.job_id)});save();
}
cloudInit();
render();
renderChat();
</script>
